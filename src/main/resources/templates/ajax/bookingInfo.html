<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>예약 목록 보기</title>
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <link rel="stylesheet" href="/css/ajax/pansion/style.css">
    </head>
    <body>
        <div id="wrap">
            <header class="d-flex justify-content-center">
                <div class="logo col-4 d-flex justify-content-center pt-2">
                    <div class="display-4" id="logo">통나무 팬션</div>
                </div>
            </header>
            <nav class="main-menu d-flex">
                <ul class="nav nav-fill w-100 font-weight-bold">
                    <li class="nav-item"><a href="/ajax/booking/notready" class="nav-link text-white">팬션소개</a></li>
                    <li class="nav-item"><a href="/ajax/booking/notready" class="nav-link text-white">객실보기</a></li>
                    <li class="nav-item"><a href="/ajax/booking/input" class="nav-link text-white">예약하기</a></li>
                    <li class="nav-item"><a href="/ajax/booking/info" class="nav-link text-white">예약목록</a></li>
                </ul>
            </nav>
            <section class="contents">
                <div class="t-title d-flex justify-content-center align-items-center">
                	<h2 class="font-weight-bold">예약 목록 보기</h2>
                </div>
                <table class="table text-center">
                	<thead>
                		<tr>
                			<th>이름</th>
                			<th>예약날짜</th>
                			<th>숙박일수</th>
                			<th>숙박인원</th>
                			<th>전화번호</th>
                			<th>예약상태</th>
                			<th>삭제</th>
                		</tr>
                	</thead>
                	<tbody>
                		<tr th:each="booking:${bookingList}">
                			<td th:text="${booking.name}"></td>
                			<td th:with="date=${booking.date}">
                				<span th:text="${#temporals.format(date, 'yyyy년 M월 d일')}"></span>
                			</td>
                			<td th:text="${booking.day}"></td>
                			<td th:text="${booking.headcount}"></td>
                			<td th:text="${booking.phoneNumber}"></td>
                			<td th:switch="${booking.state}">
                				<span class="text-info" th:case="대기중" th:text="${booking.state}"></span>
                				<span class="text-success" th:case="확정" th:text="${booking.state}"></span>
                			</td>
                			<td>
                				<button class="btn btn-danger delete-btn" th:data-booking-id="${booking.id}" type="button">삭제</button>
                			</td>
                		</tr>
                	</tbody>
                </table>
            </section>
            <footer class="p-3 pl-4">
                <div class="copyright text-muted">
                    제주특별자치도 제주시 예월읍<br>
                    사업자등록번호: 111-22-255222 / 농어촌민박사업자지정 / 대표:김통목<br>
                    Copyright 2025 tongnamuu All right reserved
                </div>
            </footer>
        </div>



        <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
        <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
        <script>
            $(function() {
                	$("#logo").on("mouseout", function(){
                		$('body').css('cursor', 'default');
                	})
                	
                	$("#logo").on("mouseover", function() {
                		$('body').css('cursor', 'pointer');
                	})
                	
                	$("#logo").on("click", function(){
                		location.href="/ajax/booking/main"
                	})
            	
            	
            	$(".delete-btn").on("click", function() {
            		let id = $(this).data("booking-id");
            		
            		$.ajax({
            			type:"get"
            			, url:"/ajax/booking/delete"
            			, data:{"id":id}
            			, success:function(response) {
            				if(response.result == 1) {
            					location.reload();
            				} else {
            					alert("삭제 실패!");
            				}
            			}
            			, error:function(response) {
            				alert("삭제 에러!");
            			}
            			
            		})
            	})
            })
        </script>
    </body>
</html>

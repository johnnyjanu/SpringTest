<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>즐겨 찾기 추가하기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
	
	<h1 class="mb-2">즐겨 찾기 추가하기</h1>
	<label class="mb-2">제목</label>
	<input class="form-control mb-2" type="text" id="nameInput">
	<label class="mb-2">주소</label>
	<input class="form-control mb-2" type="text" id="urlInput">
	<button class="btn btn-success btn-block" type="button" id="inputBtn">추가</button>


<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
	$(function() {
		$("#inputBtn").on("click", function() {
			let name = $("#nameInput").val();
			let url = $("#urlInput").val();
			
			if(name == "") {
				alert("제목을 입력하세요");
				return ;
			}
			if(url == "") {
				alert("주소를 입력하세요");
				return ;
			}
			if(!(url.startsWith("http://") || url.startsWith("https://"))) {
				alert("올바른 주소를 입력하세요");
				return ;
			}
			
			$.ajax({
				type:"post"
				, url:"/ajax/bookmark/create"
				, data:{"name":name, "url":url}
				, success:function(response) {
					if(response.result == 1) {
						location.href="/ajax/bookmark/info";
					} else {
						alert("즐겨 찾기 추가 실패");	
					}
				}
				, error:function(response) {
					alert("즐겨 찾기 추가 에러");
				}
			})
			
		})
		
	})
</script>
</body>
</html>

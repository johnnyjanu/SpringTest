<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>즐겨 찾기 추가하기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<link rel="stylesheet" href="/css/ajax/style.css">
</head>
<body>
	<div id="wrap">
		<h1 class="mb-2">즐겨 찾기 추가하기</h1>
		<label class="mb-2">제목</label>
		<input class="form-control mb-2" type="text" id="nameInput">
		<label class="mb-2">주소</label>
		<div class="d-flex">
			<input class="form-control col-10" type="text" id="urlInput">
			<span class="col-2">
				<button class="btn btn-info btn-block font-weight-bold" type="button" id="duplicateBtn">중복 확인</button>	
			</span>
		</div>
		<div class="text-danger hide" id="duplicateId">중복된 url 입니다</div>
		<div class="text-info hide" id="ableId">저장 가능한 url 입니다.</div>
		<button class="btn btn-success btn-block font-weight-bold mt-2" type="button" id="inputBtn">추가</button>
	</div>


<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
	$(function() {
		$("#duplicateBtn").on("click", function() {
			let url = $("#urlInput").val();
			
			if(url == "") {
				alert("주소를 입력하세요");
				return ;
			}
			if(!(url.startsWith("http://") || url.startsWith("https://"))) {
				alert("올바른 주소를 입력하세요");
				return ;
			}
			
			$.ajax({
				type:"post"
				, url:"/ajax/bookmark/duplicate"
				, data:{"url": url}
				, success:function(response) {
					if(response.isDuplicate) {
						$("#duplicateId").removeClass("hide");
						$("#ableId").addClass("hide");
						return;
					} else {
						$("#ableId").removeClass("hide");
						$("#duplicateId").addClass("hide");
						return ;
					}
				}
				, error:function(response) {
					alert("중복확인 오류");
					return ;
				}
			})
			
		})
		
		
		$("#inputBtn").on("click", function() {
			let name = $("#nameInput").val();
			let url = $("#urlInput").val();
			
			if(name == "") {
				alert("제목을 입력하세요");
				return ;
			}
			if(url == "") {
				alert("주소를 입력하세요");
				return ;
			}
			if($("#ableId").hasClass("hide")) {
				alert("중복 확인 후 실시해주세요");
				return ;
			}
			
			
			$.ajax({
				type:"post"
				, url:"/ajax/bookmark/create"
				, data:{"name":name, "url":url}
				, success:function(response) {
					if(response.result == 1) {
						location.href="/ajax/bookmark/info";
						return;
					} else {
						alert("즐겨 찾기 추가 실패");
						return;
					}
				}
				, error:function(response) {
					alert("즐겨 찾기 추가 에러");
					return;
				}
			})
			
		})
		
	})
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <title>통나무 팬션</title>
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <link rel="stylesheet" href="/css/ajax/pansion/style.css">
    </head>
    <body>
        <div id="wrap">
            <header class="d-flex justify-content-center">
                <div class="logo col-4 d-flex justify-content-center pt-2">
                    <div class="display-4" id="logo">통나무 팬션</div>
                </div>
            </header>
            <nav class="main-menu d-flex">
                <ul class="nav nav-fill w-100 font-weight-bold">
                    <li class="nav-item"><a href="/ajax/booking/notready" class="nav-link text-white">팬션소개</a></li>
                    <li class="nav-item"><a href="/ajax/booking/notready" class="nav-link text-white">객실보기</a></li>
                    <li class="nav-item"><a href="/ajax/booking/input" class="nav-link text-white">예약하기</a></li>
                    <li class="nav-item"><a href="/ajax/booking/info" class="nav-link text-white">예약목록</a></li>
                </ul>
            </nav>
            <section class="contents">
                <div class="banner">
                    <img width="1200px" height="500px" id="banner1" alt="배너 이미지" src="http://marondal.com/material/images/dulumary/web/front/jquery/test06_banner1.jpg">
                    <img width="1200px" height="500px" id="banner2" class="d-none" alt="배너 이미지" src="http://marondal.com/material/images/dulumary/web/front/jquery/test06_banner2.jpg">
                    <img width="1200px" height="500px" id="banner3" class="d-none" alt="배너 이미지" src="http://marondal.com/material/images/dulumary/web/front/jquery/test06_banner3.jpg">
                    <img width="1200px" height="500px" id="banner4" class="d-none" alt="배너 이미지" src="http://marondal.com/material/images/dulumary/web/front/jquery/test06_banner4.jpg">
                </div>
                <article class="main-contents d-flex">
                    <div class="confirm col-4 d-flex justify-content-center align-items-center">
                        <div class="rev-font text-white font-weight-light">
                            실시간<br>
                            예약하기
                        </div>
                    </div>
                    <div class="reservation col-5">
                        <div class="address h-25 font-weight-bold d-flex">
                            <div class="text-white col-4 p-0 font-size d-flex justify-content-center align-items-center">예약 확인</div>
                        </div>
                        <div id="non-memberInput">
                            <div class="d-flex pb-3">
                                <label class="col-3 text-white font-weight-bold">이름 : </label>
                                <input type="text" id="nameInput" class="form-control col-7">
                            </div>
                            <div class="d-flex pb-3">
                                <label class="col-3 text-white font-weight-bold">전화번호 : </label>
                                <input type="text" id="phoneNumberInput" class="form-control col-7">
                            </div>
                        </div>
                        <div class="col-11 d-flex justify-content-end">
                            <button type="button" id="checkBtn" class="btn btn-success font-weight-bold">조회하기</button>
                        </div>
                    </div>
                    <div class="tel col-3 d-flex justify-content-center align-items-center">
                        <div class="tels">
                            <div class="text-white font-weight-bold rev-font">예약문의:</div>
                            <div class="text-white font-weight-bold tel-font">
                                010-<br>
                                000-1111
                            </div>
                        </div>
                    </div>
                </article>
            </section>
            <footer class="p-3 pl-4">
                <div class="copyright text-muted">
                    제주특별자치도 제주시 예월읍<br>
                    사업자등록번호: 111-22-255222 / 농어촌민박사업자지정 / 대표:김통목<br>
                    Copyright 2025 tongnamuu All right reserved
                </div>
            </footer>
        </div>



        <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
        <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
        <script>
            $(function() {
            	$("#logo").on("mouseout", function(){
            		$('body').css('cursor', 'default');
            	})
            	
            	$("#logo").on("mouseover", function() {
            		$('body').css('cursor', 'pointer');
            	})
            	
            	$("#logo").on("click", function(){
            		location.href="/ajax/booking/main"
            	})
            	
            	
                let imgArray = [$("#banner1"), $("#banner2"), $("#banner3"), $("#banner4")];
                let i = 0;
                function changeBanner() {
                    imgArray[i].addClass("d-none");
                    i++;
                    if(i == imgArray.length) {
                        i = 0;
                    }
                    imgArray[i].removeClass("d-none");
                }
                setInterval(changeBanner, 3000);







                $("#checkBtn").on("click", function() {
                        let name = $("#nameInput").val();
                        let phoneNumber = $("#phoneNumberInput").val();
                        if(name == "") {
                            alert("이름을 입력하세요.");
                            return;
                        }
                        if(phoneNumber == "") {
                            alert("전화번호를 입력하세요.");
                            return;
                        }
                        if(phoneNumber.substring(0,3) != "010") {
                            alert("010으로 시작하는 번호만 입력 가능합니다.");
                            return;
                        }
                        let phonerule = /^(010)-[0-9]{3,4}-[0-9]{4}$/;
                        if(!phonerule.test(phoneNumber)) {
                            alert("올바른 전화번호를 입력하세요.")
                            return;
                        }
                        
                        $.ajax({
                        	type:"get"
                        	, url:"/ajax/booking/check"
                        	, data:{"name":name, "phoneNumber":phoneNumber}
                        	, success:function(response){
                        		if(response.name != undefined) {
	                        		alert("이름:" + response.name + "\n날짜:" + response.date + "\n일수:" + response.day + "\n인원:" + 4 + "\n상태:" + response.state);                        			
                        		} else {
                        			alert("조회 결과 없음");
                        		}
                        	}
                        	, error:function(response) {
                        		alert("조회 에러")
                        	}
                        	
                        })


                })
            })
        </script>
    </body>
</html>

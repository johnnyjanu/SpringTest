<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>통나무 팬션</title>
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <link rel="stylesheet" href="/css/ajax/pansion/style.css">
    </head>
    <body>
        <div id="wrap">
            <header class="d-flex justify-content-center">
                <div class="logo col-4 d-flex justify-content-center pt-2">
                    <div class="display-4">통나무 팬션</div>
                </div>
            </header>
            <nav class="main-menu d-flex">
                <ul class="nav nav-fill w-100 font-weight-bold">
                    <li class="nav-item"><a href="#" class="nav-link text-white">팬션소개</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">객실보기</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">예약하기</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">예약목록</a></li>
                </ul>
            </nav>
            <section class="contents">
                <div class="banner">
                    <img width="1200px" height="500px" id="banner1" alt="배너 이미지" src="http://marondal.com/material/images/dulumary/web/front/jquery/test06_banner1.jpg">
                    <img width="1200px" height="500px" id="banner2" class="d-none" alt="배너 이미지" src="http://marondal.com/material/images/dulumary/web/front/jquery/test06_banner2.jpg">
                    <img width="1200px" height="500px" id="banner3" class="d-none" alt="배너 이미지" src="http://marondal.com/material/images/dulumary/web/front/jquery/test06_banner3.jpg">
                    <img width="1200px" height="500px" id="banner4" class="d-none" alt="배너 이미지" src="http://marondal.com/material/images/dulumary/web/front/jquery/test06_banner4.jpg">
                </div>
                <article class="main-contents d-flex">
                    <div class="confirm col-4 d-flex justify-content-center align-items-center">
                        <div class="rev-font text-white font-weight-light">
                            실시간<br>
                            예약하기
                        </div>
                    </div>
                    <div class="reservation col-5">
                        <div class="address h-25 font-weight-bold d-flex">
                            <div class="text-white col-4 p-0 font-size d-flex justify-content-center align-items-center">예약 확인</div>
                            <label for="memberRadio" class="text-white d-flex align-items-center mr-2">회원</label>
                            <input type="radio" name="membership" id="memberRadio" value="member" class="mr-2" checked>
                            <label for="non-memberRadio" class="text-white d-flex align-items-center mr-2">비 회원</label>
                            <input type="radio" name="membership" id="non-memberRadio" value="non-member">
                        </div>
                        <div id="memberInput">
                            <div class="d-flex pb-3">
                                <label class="col-3 text-white font-weight-bold">아이디 : </label>
                                <input type="text" id="idInput" class="form-control col-7">
                            </div>
                            <div class="d-flex pb-3">
                                <label class="col-3 text-white font-weight-bold">비밀번호 : </label>
                                <input type="password" id="passwordInput" class="form-control col-7">
                            </div>
                        </div>
                        <div id="non-memberInput" class="d-none">
                            <div class="d-flex pb-3">
                                <label class="col-3 text-white font-weight-bold">이름 : </label>
                                <input type="text" id="nameInput" class="form-control col-7">
                            </div>
                            <div class="d-flex pb-3">
                                <label class="col-3 text-white font-weight-bold">전화번호 : </label>
                                <input type="text" id="telInput" class="form-control col-7">
                            </div>
                            <div class="d-flex pb-3">
                                <label class="col-3 text-white font-weight-bold">날짜 : </label>
                                <input type="text" id="dateInput" class="form-control col-7">
                            </div>
                        </div>
                        <div class="col-11 d-flex justify-content-end">
                            <button type="button" id="checkBtn" class="btn btn-success font-weight-bold">조회하기</button>
                        </div>
                    </div>
                    <div class="tel col-3 d-flex justify-content-center align-items-center">
                        <div class="tels">
                            <div class="text-white font-weight-bold rev-font">예약문의:</div>
                            <div class="text-white font-weight-bold tel-font">
                                010-<br>
                                000-1111
                            </div>
                        </div>
                    </div>
                </article>
            </section>
            <footer class="p-3 pl-4">
                <div class="copyright text-muted">
                    제주특별자치도 제주시 예월읍<br>
                    사업자등록번호: 111-22-255222 / 농어촌민박사업자지정 / 대표:김통목<br>
                    Copyright 2025 tongnamuu All right reserved
                </div>
            </footer>
        </div>



        <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
        <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
        <script>
            $(function() {
                let imgArray = [$("#banner1"), $("#banner2"), $("#banner3"), $("#banner4")];
                let i = 0;
                function changeBanner() {
                    imgArray[i].addClass("d-none");
                    i++;
                    if(i == imgArray.length) {
                        i = 0;
                    }
                    imgArray[i].removeClass("d-none");
                }
                setInterval(changeBanner, 3000);







                $("#checkBtn").on("click", function() {
                    let membership = $("input[name=membership]:checked").val();
                    if(membership == "member") {
                        let id = $("#idInput").val();
                        let password = $("#passwordInput").val();
                        if(id == "") {
                            alert("아이디를 입력하세요.");
                            return;
                        }
                        if(password == "") {
                            alert("비밀번호를 입력하세요.");
                            return;
                        }
                        alert();
                    } else {
                        let name = $("#nameInput").val();
                        let tel = $("#telInput").val();
                        let date = $("#dateInput").val();
                        if(name == "") {
                            alert("이름을 입력하세요.");
                            return;
                        }
                        if(tel == "") {
                            alert("전화번호를 입력하세요.");
                            return;
                        }
                        if(tel.substring(0,3) != "010") {
                            alert("010으로 시작하는 번호만 입력 가능합니다.");
                            return;
                        }
                        let phonerule = /^(010)[0-9]{3,4}[0-9]{4}$/;
                        if(!phonerule.test(tel)) {
                            alert("올바른 전화번호를 입력하세요.")
                            return;
                        }
                        if(date == "") {
                            alert("날짜를 선택하세요.");
                            return;
                        }
                        alert();
                    }

                    



                })


                $("#dateInput").datepicker({
                    dateFormat:"yy년 m월 d일",
                    dayNamesMin:["일", "월", "화", "수", "목", "금", "토"],
                    minDate:0
                });


                $("input[name=membership]").on("change", function() {
                    let membership = $(this).val();
                    if(membership == "member") {
                        $("#memberInput").removeClass("d-none");
                        $("#non-memberInput").addClass("d-none");
                    } else {
                        $("#memberInput").addClass("d-none");
                        $("#non-memberInput").removeClass("d-none");
                    }
                })

            })
        </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>날짜 포맷과 String 함수</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
<div  class="p-3">
	<h1>회원 정보 리스트</h1>
	
	<table class="table text-center">
		<thead>
			<tr>
				<th>No</th>
				<th>이름</th>
				<th>생년월일</th>
				<th>전화번호</th>
				<th>국적</th>
				<th>이메일</th>
				<th>자기소개</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="member, status:${members}">
				<td th:text="${status.count}">1</td>
				<td th:text="${member.name}">2</td>
				<td th:with="birth=${member.birth}">
					<span th:text="${#temporals.format(birth, 'yyy년 M월 d일')}"></span>
				</td>
				<td th:with="phoneNumber=${member.phoneNumber}">
					<span th:if="${#strings.startsWith(phoneNumber, '010')}" th:text="${phoneNumber}"></span>
					<span th:unless="${#strings.startsWith(phoneNumber, '010')}">유효하지 않은 전화번호</span>
				</td>
				<td th:with="nationality=${member.nationality}">
					<span th:text="${#strings.replace(nationality, '시대', ' - ')}"></span>
				</td>
				<td th:with="email=${member.email}">
					<span th:utext="|<b>${#strings.arraySplit(email, '@')[0]}</b>@${#strings.arraySplit(email, '@')[1]}|"></span>
				</td>
				<!-- 				 
				<td th:with="introduce=${member.introduce}">
					<span th:if="${#strings.length(introduce)} <= 15" th:text="${introduce}"></span>
					<span th:unless="${#strings.length(introduce)} <= 15" th:text="|${#strings.substring(introduce, 0, 15)}...|"></span>
				</td>
				 -->
				 <td th:text="${#strings.abbreviate(member.introduce, 18)}"></td>
			</tr>
		</tbody>
	</table>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
</body>
</html>
